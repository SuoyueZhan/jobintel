services:
  db:
    image: postgres:16
    container_name: jobintel-db
    environment:
      POSTGRES_USER: jobintel
      POSTGRES_PASSWORD: jobintel_pw
      POSTGRES_DB: jobintel
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobintel -d jobintel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
