name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobintel
          POSTGRES_PASSWORD: jobintel_pw
          POSTGRES_DB: jobintel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobintel -d jobintel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://jobintel:jobintel_pw@localhost:5432/jobintel

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Initialize DB schema (SQLAlchemy)
        run: |
          python -m app.init_db

      - name: Run tests
        run: |
          if [ -d tests ]; then python -m unittest discover -s tests; fi
          pytest -q
